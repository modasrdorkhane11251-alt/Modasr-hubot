<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>مافیا آنلاین - Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      window.__DETECTED_PLATFORM__ = (function () {
        if (window.Telegram?.WebApp?.initData) return 'telegram';
        var ua = navigator.userAgent.toLowerCase();
        if (ua.includes('bale')) return 'bale';
        if (ua.includes('rubika')) return 'rubika';
        return 'telegram';
      })();
    </script>
  </head>
  <body class="bg-[#0f172a] text-white overflow-x-hidden">
    <div id="mafia-root"></div>
    <script type="module" src="/src/mafia-app/main.tsx"></script>
  </body>
</html>
